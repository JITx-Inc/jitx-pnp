# pyproject.toml

[build-system]
requires = [
  "hatchling>=1.27.0,<2.0",
  "hatch-vcs>=0.5.0,<0.6.0",
  "ruff==0.14.9",
  "pyright>=1.1.398,<1.2.0",
]
build-backend = "hatchling.build"

[project]
name = "jitxlib-pnp"
dynamic = ["version"]
description = "Export pick-and-place files from JITX designs"
readme = "README.md"
license = "MIT"
dependencies = [
  # 4.6 made `RuntimeDesign.root` a read-only property backed by private
  # submission state, which the test stand-in shadows rather than assigns,
  # and it is where `jitx.units.valuestring` arrived. The exported data
  # itself - `RuntimeDesign.query`, `Placement.side` composed through the
  # multiply chain, the `soldered` flag resolved during capture - is
  # unchanged from 4.4.
  "jitx>=4.6,<5",
]
requires-python = ">=3.12"
authors = [
  { name = "JITX", email = "b.gupta@jitx.com" },
]
keywords = ["jitx", "pick-and-place", "pnp", "pcb", "electronics", "manufacturing"]
classifiers = [
  "Development Status :: 4 - Beta",
  "Intended Audience :: Developers",
  "Intended Audience :: Manufacturing",
  "License :: OSI Approved :: MIT License",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.12",
  "Programming Language :: Python :: 3.13",
  "Topic :: Scientific/Engineering :: Electronic Design Automation (EDA)",
]

[project.entry-points.jitx-plugin]
export = "jitxlib.pnp.plugin"

[project.urls]
Homepage = "https://github.com/JITx-Inc/jitx-pnp"
Repository = "https://github.com/JITx-Inc/jitx-pnp"
Issues = "https://github.com/JITx-Inc/jitx-pnp/issues"

[tool.hatch.build.targets.wheel]
packages = ["src/jitxlib"]

[tool.hatch.version]
source = "vcs"
fallback-version = "0.0.0+undefined"

[tool]

# tests: run "hatch test"
[tool.hatch.envs.hatch-test]
randomize = true
parallel = false
installer = "pip"
extra-args = ["-vv"]
dependencies = [
  "coverage[toml]",
  "pytest",
  "pytest-cov",
]

[[tool.hatch.envs.test.matrix]]
python = ["3.12", "3.13"]

[tool.pytest.ini_options]
# 4.6 turned `RuntimeDesign.nets` and `.layers` into properties and left the
# callable forms as shims that warn. Nothing here calls them, and a warning
# is how that would first show up, so the categories are errors rather than
# console noise a test run scrolls past.
filterwarnings = [
  "error::DeprecationWarning",
  "error::PendingDeprecationWarning",
  "error::RuntimeWarning",
]

# formatting: run "hatch fmt --check"
[tool.hatch.envs.hatch-static-analysis]
dependencies = ["ruff==0.14.9"]
config-path = "none"  # don't use hatch defaults

[tool.ruff]
line-length = 88
indent-width = 4
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "W", "A", "B", "C"]
# E501 line too long - let ruff format handle that
# A002 argument shadowing a builtin (`format`, which is what the flag is called)
# A005 builtin module shadowing (false positive)
# C901 mccabe complexity check, limits to 10
ignore = ["E501", "A005", "C901", "A002"]

[tool.ruff.format]
quote-style = "double"
indent-style = "space"

# pyright: run "hatch run types:check"
[tool.hatch.envs.types]
extra-dependencies = [
  "pyright>=1.1.0",
  # pyrightconfig.json type-checks tests/ and examples/ too
  "pytest",
]

[tool.hatch.envs.types.scripts]
check = "pyright ."
stats = "pyright --stats ."
